plugins {
    id "eclipse"
    id "idea"
    id "java-library"
    id "net.minecraftforge.gradle" version "6.0.25"
    id "org.spongepowered.mixin" version "0.7.+"
    id "me.modmuss50.mod-publish-plugin" version "0.5.2"
}

version = mod_version + "-forge-" + minecraft_suffix
group = maven_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(java_target)

println("Java: " + System.getProperty("java.version") + " JVM: " + System.getProperty("java.vm.version") + "(" + System.getProperty("java.vendor") + ") Arch: " + System.getProperty("os.arch"))

// Keep parameter names when compiling
compileJava.options.compilerArgs.add '-parameters'

repositories {
    flatDir { dirs "libs" }
    maven { url "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    exclusiveContent {
        forRepository {
            maven { url = "https://repo.spongepowered.org/maven" }
        }
        filter { includeGroup "org.spongepowered" }
    }
    maven { url = "https://maven.shedaniel.me/" } // REI
    maven { url = "https://maven.blamejared.com/" } // JEI
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Core library
    implementation fg.deobf(files("libs/supermartijn642corelib-1.1.24-forge-mc1.20.1.jar"))
    // Config library
    implementation fg.deobf(files("libs/supermartijn642configlib-1.1.8-forge-mc1.20.jar"))
    // Rechiseled
    implementation fg.deobf(files("libs/rechiseled-1.1.6-forge-mc1.20.jar"))
    // Fusion
    implementation fg.deobf("maven.modrinth:fusion-connected-textures:${fusion_version}")
    // Applied Energistics 2
    implementation fg.deobf(files("libs/appliedenergistics2-forge-15.4.10.jar"))
    // GuideME
    runtimeOnly fg.deobf("maven.modrinth:guideme:${guideme_version}")

    // Just Enough Items
    implementation fg.deobf("mezz.jei:jei-1.20.1-forge:${just_enough_items_version}")
    // Roughly Enough Items
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${roughly_enough_items_version}")
    // Cloth Config API
    compileOnly fg.deobf("curse.maven:cloth-config-348521:${cloth_config_api_file}")
    // Architectury API
    compileOnly fg.deobf("curse.maven:architectury-api-419699:${architectury_api_file}")
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir "src/generated/resources" }

processResources {
    inputs.property "version", version

    // Replace the mod version
    Map<String, ?> copyProperties = project.properties.clone() as Map<String, ?>
    //noinspection UnnecessaryQualifiedReference
    var matcher = java.util.regex.Pattern.compile("[^.0-9]").matcher(copyProperties.mod_version as String)
    if (matcher.find())
        copyProperties.mod_version = copyProperties.mod_version.substring(0, matcher.start()) + "+" + copyProperties.mod_version.substring(matcher.start())

    filesMatching(["META-INF/mods.toml", "modid.mixins.json", "pack.mcmeta"]) {
        expand copyProperties
    }

    exclude "**/*.pdn"

    rename "^modid.mixins.json\$", "${mod_id}.mixins.json"
    rename "^icon.png\$", "${mod_id}.png"
}

minecraft {
    mappings channel: "official", version: minecraft_version

    accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        configureEach {
            workingDirectory file("run")

            property "forge.logging.markers", "REGISTRIES"

            mods {
                //noinspection GroovyAssignabilityCheck
                source sourceSets.main
            }
        }

        client {
        }

        server {
        }

        data {
            args "--mod", mod_id
            args "--all"
            args "--output", file("src/generated/resources/")
            args "--existing", layout.buildDirectory.file("/data_resources").map { it.asFile }.get()
        }
    }
}

// Rename the IntelliJ run configs
gradle.taskGraph.whenReady {
    tasks.genIntellijRuns.doLast {
        def configDir = it.getRunConfigurationsFolder().get().getAsFile()
        minecraft.runs.each {
            //noinspection GroovyAssignabilityCheck
            def configFile = new File(configDir, it.getUniqueFileName() + ".xml")
            if(configFile.exists()){
                def xml = new groovy.xml.XmlSlurper().parse(configFile)
                //noinspection GrUnresolvedAccess
                xml.configuration.@name = "Forge " + it.name.capitalize()
                configFile.withWriter { groovy.xml.XmlUtil.serialize(xml, it) }
            }
        }
    }
}

tasks.register('prepareDataResources', Sync) {
    from file("src/main/resources")
    into layout.buildDirectory.dir("/data_resources")
    inputs.property "version", version

    // Replace the mod version
    Map<String, ?> copyProperties = project.properties.clone() as Map<String, ?>
    //noinspection UnnecessaryQualifiedReference
    var matcher = java.util.regex.Pattern.compile("[^.0-9]").matcher(copyProperties.mod_version as String)
    if (matcher.find())
        copyProperties.mod_version = copyProperties.mod_version.substring(0, matcher.start()) + "+" + copyProperties.mod_version.substring(matcher.start())

    filesMatching(["META-INF/mods.toml", "modid.mixins.json", "pack.mcmeta"]) {
        expand copyProperties
    }

    exclude "**/*.pdn"

    rename "^modid.mixins.json\$", "${mod_id}.mixins.json"
    rename "^icon.png\$", "${mod_id}.png"
}

// Run prepareDataResources before prepareRunData
tasks.configureEach {
    if (it.name == "prepareRunData" || it.name == "prepareRunDataCompile")
        it.dependsOn "prepareDataResources"
}

// Prevent stale RechiseledAE block IDs from ever being packaged into block tags.
// Rechiseled 1.1.6 does not provide the newer stairs/slabs block-builder API, so
// every rechiseledae:* tag entry must correspond to an actually generated blockstate.
tasks.register("validateRechiseledAEMiningTags") {
    doLast {
        def blockstatesDir = file("src/generated/resources/assets/rechiseledae/blockstates")
        def actualBlocks = blockstatesDir.exists() ? blockstatesDir.listFiles()
            .findAll { it.name.endsWith(".json") }
            .collect { it.name.substring(0, it.name.length() - 5) } as Set : [] as Set

        def invalid = []
        fileTree("src/generated/resources/data/minecraft/tags/blocks").matching { include "**/*.json" }.files.each { tagFile ->
            def json = new groovy.json.JsonSlurper().parse(tagFile)
            (json.values ?: []).each { value ->
                if (value instanceof String && value.startsWith("rechiseledae:")) {
                    def blockId = value.substring("rechiseledae:".length())
                    if (!actualBlocks.contains(blockId))
                        invalid << "${tagFile}: ${value}"
                }
            }
        }

        if (!invalid.isEmpty())
            throw new GradleException("Invalid RechiseledAE block tag references found:\n" + invalid.join("\n"))

        logger.lifecycle("RechiseledAE block-tag validation passed: ${actualBlocks.size()} generated blockstates checked.")
    }
}

tasks.named("build").configure {
    dependsOn("validateRechiseledAEMiningTags")
}

// Force the jar to be reobfuscated
jar.finalizedBy('reobfJar')

publishMods {
    file = jar.archiveFile
    displayName = "${mod_name} ${mod_version} for Forge ${minecraft_suffix.substring(2)}"
    version = project.version
    //noinspection UnnecessaryQualifiedReference
    type = me.modmuss50.mpp.ReleaseType.of(publishing_release_type.toUpperCase())
    changelog = file("changelog.md").text
    modLoaders.add("forge")
    modLoaders.add("neoforge")
    maxRetries = 2

    curseforge {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        projectId = curseforge_project_id
        if (!curseforge_required_dependency_ids.isEmpty())
            curseforge_required_dependency_ids.split(" ").each it::requires
        if (!curseforge_optional_dependency_ids.isEmpty())
            curseforge_optional_dependency_ids.split(" ").each it::optional
        publishing_game_versions.split(" ").each minecraftVersions::add
        clientRequired = true
        serverRequired = true
    }

    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN")
        projectId = modrinth_project_id
        displayName = "${mod_name} ${mod_version}"
        if (!modrinth_required_dependency_ids.isEmpty())
            modrinth_required_dependency_ids.split(" ").each it::requires
        if (!modrinth_optional_dependency_ids.isEmpty())
            modrinth_optional_dependency_ids.split(" ").each it::optional
        publishing_game_versions.split(" ").each minecraftVersions::add
    }
}

// Rename the 'publishMods' task
tasks.publishMods.group = "other"
tasks.register("publishAll") {
    group = "publishing"
    dependsOn(tasks.publishMods)
}
